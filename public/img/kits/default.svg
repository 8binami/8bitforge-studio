<svg xmlns="http://www.w3.org/2000/svg" width="280" height="175" viewBox="0 0 280 175">
  <defs>
    <radialGradient id="disc" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a35"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </radialGradient>
    <radialGradient id="label" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e1e3a"/>
      <stop offset="100%" style="stop-color:#13132b"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="280" height="175" fill="#13132b"/>

  <!-- Outer vinyl disc -->
  <circle cx="140" cy="87" r="78" fill="url(#disc)" stroke="#1e1e3a" stroke-width="1.5"/>

  <!-- Vinyl grooves -->
  <circle cx="140" cy="87" r="73" fill="none" stroke="#1e1e3a" stroke-width="0.6"/>
  <circle cx="140" cy="87" r="68" fill="none" stroke="#1e1e3a" stroke-width="0.6"/>
  <circle cx="140" cy="87" r="63" fill="none" stroke="#00e5ff" stroke-width="0.4" opacity="0.18"/>
  <circle cx="140" cy="87" r="58" fill="none" stroke="#1e1e3a" stroke-width="0.6"/>
  <circle cx="140" cy="87" r="53" fill="none" stroke="#1e1e3a" stroke-width="0.6"/>
  <circle cx="140" cy="87" r="48" fill="none" stroke="#00e5ff" stroke-width="0.4" opacity="0.18"/>
  <circle cx="140" cy="87" r="43" fill="none" stroke="#1e1e3a" stroke-width="0.6"/>
  <circle cx="140" cy="87" r="38" fill="none" stroke="#1e1e3a" stroke-width="0.5"/>

  <!-- Center label -->
  <circle cx="140" cy="87" r="30" fill="url(#label)" stroke="#00e5ff" stroke-width="1.2" opacity="0.9"/>
  <circle cx="140" cy="87" r="24" fill="none" stroke="#1e1e3a" stroke-width="0.8"/>

  <!-- Label text -->
  <text x="140" y="82" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00e5ff" opacity="0.85" letter-spacing="1">8BIT</text>
  <text x="140" y="92" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00e5ff" opacity="0.85" letter-spacing="1">FORGE</text>

  <!-- Center hole -->
  <circle cx="140" cy="87" r="4.5" fill="#0d0d1a" stroke="#00e5ff" stroke-width="0.8" opacity="0.7"/>

  <!-- Subtle highlight on disc (gloss effect) -->
  <ellipse cx="112" cy="60" rx="18" ry="9" fill="#00e5ff" opacity="0.03" transform="rotate(-25 112 60)"/>

  <!-- Cyan accent dot decorations (bottom corners) -->
  <circle cx="30" cy="155" r="3" fill="#00e5ff" opacity="0.08"/>
  <circle cx="250" cy="155" r="3" fill="#00e5ff" opacity="0.08"/>
  <circle cx="20" cy="145" r="1.5" fill="#00e5ff" opacity="0.06"/>
</svg>
