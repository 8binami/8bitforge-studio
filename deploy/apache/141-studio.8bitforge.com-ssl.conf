# studio.8bitforge.com: the studio's web build, behind Cloudflare.
#
# Static files only: the contents of dist/web after `npm run build`, copied
# into public/. No PHP, no database; the studio talks to api.8bitforge.com.
#
# The certificate is the 8bitforge.com zone's origin certificate, which
# covers *.8bitforge.com: the same files as the API's.

<VirtualHost *:443>
    ServerName studio.8bitforge.com
    DocumentRoot /srv/8binami/studio.8bitforge.com/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/8bitforge.com.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/8bitforge.com.key

    # The audio export runs FFmpeg in WebAssembly with SharedArrayBuffer,
    # which a browser only allows on a page isolated by these two. Without
    # them MP3, FLAC and OGG export fail. The dev server and the desktop app
    # send the same pair.
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Embedder-Policy "credentialless"

    Header always set X-Content-Type-Options "nosniff"
    # A sign-in link lands here with its token in the address: it must not
    # travel on to any other site in a Referer.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    AddType application/wasm .wasm

    <Directory /srv/8binami/studio.8bitforge.com/public>
        Options -Indexes -MultiViews -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        # Nothing here runs, and nothing hidden is served.
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Files whose name carries the build's hash never change: cache them for
    # a year. Everything else (index.html first) is checked on every visit,
    # or an update would never reach anyone.
    <LocationMatch "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(?!assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$)">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/studio.8bitforge.com-error.log
    CustomLog ${APACHE_LOG_DIR}/studio.8bitforge.com-access.log combined
</VirtualHost>
