# studio.8bitforge.com, port 80: nothing but the way to HTTPS.
#
# Cloudflare sits in front, in SSL mode "Full (strict)", as for the API.

<VirtualHost *:80>
    ServerName studio.8bitforge.com
    Redirect permanent / https://studio.8bitforge.com/
    ErrorLog  ${APACHE_LOG_DIR}/studio.8bitforge.com-error.log
    CustomLog ${APACHE_LOG_DIR}/studio.8bitforge.com-access.log combined
</VirtualHost>
